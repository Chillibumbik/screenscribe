[project]
name = "screenscribe"
version = "0.1.0"
description = "Local transcriber for calls and screen recordings: speech, speakers and on-screen text in one timeline. CPU only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "av>=14",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "rapidocr>=3.10",
    "sherpa-onnx>=2.0",
]

[project.scripts]
screenscribe = "screenscribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
